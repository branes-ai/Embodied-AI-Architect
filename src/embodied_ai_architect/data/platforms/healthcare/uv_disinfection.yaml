context:
  typical_architecture: "Mobile base with differential drive and 2D LiDAR for room navigation and multi-position placement. Tower-mounted array of UV-C mercury lamps (254nm) or pulsed xenon lamps providing 360-degree irradiation. Integrated UV dosimeters measure delivered dose at multiple heights. Multiple safety interlocks: PIR occupancy detection, door sensors, and motion detectors ensure immediate shutoff if a person enters the room. Cloud dashboard tracks disinfection cycles, room coverage, and compliance reporting."
  common_pitfalls:
    - "UV-C only works on line-of-sight surfaces; shadowed areas require multi-position treatment or room rearrangement"
    - "UV dose falls off with inverse-square law; surfaces 3m from the lamp receive 1/9th the dose of surfaces at 1m"
    - "UV-C degrades plastics, rubber, and some textiles with repeated exposure; sensitive equipment must be shielded"
    - "Mercury lamp warm-up time (2-5 minutes) extends cycle time; pulsed xenon has no warm-up but lower efficiency"
    - "False occupancy alarms from HVAC air movement triggering PIR sensors cause unnecessary cycle interruptions"
  regulatory:
    - "FDA Class II medical device (UV disinfection)"
    - "IEC 62471 photobiological safety"
    - "IEC 60601-1 for hospital-use electrical equipment"
    - "OSHA UV exposure limits for workers"
    - "EPA establishment registration for pesticidal claims"
  reference_designs:
    - "Xenex LightStrike"
    - "UVD Robots (Blue Ocean Robotics)"
    - "Tru-D SmartUVC"
    - "ADIBOT-S (Ubtech)"
    - "Ava Robotics UV"
  design_considerations: "UV-C disinfection effectiveness is measured in log reduction of specific pathogens, typically requiring 20-40 mJ/cm2 for 3-log reduction of MRSA and 40-80 mJ/cm2 for C. diff spores. Room geometry analysis should pre-compute optimal robot positions (typically 3-5 positions per room) to minimize shadowing while maximizing dose uniformity. The safety interlock system must be fail-safe with redundant occupancy detection; a single UV-C exposure event to a person would be a serious incident. Navigation and mapping requirements are modest compared to other mobile robots since the robot operates in empty rooms with known layouts."

qualification:
  suggested_questions:
    - room_types
    - room_size_sqm
    - target_pathogens
    - cycle_time_budget_min
    - rooms_per_day
  critical_constraints:
    - "3+ log pathogen reduction"
    - "Fail-safe human occupancy detection"
    - "Multi-position room coverage"
    - "< 15 minute cycle per position"
  optional_constraints:
    - "Autonomous room-to-room navigation"
    - "Integration with EVS scheduling system"
    - "Cloud compliance reporting"
