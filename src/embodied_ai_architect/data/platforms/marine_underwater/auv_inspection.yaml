id: marine_underwater.auv_inspection
name: "Inspection AUV"
category: marine_underwater
description: "Autonomous underwater vehicle for subsea pipeline, hull, and infrastructure inspection using sonar, cameras, and acoustic positioning in depths up to several thousand meters."
aliases:
  - "subsea inspection robot"
  - "underwater inspection vehicle"
  - "pipeline inspection AUV"

