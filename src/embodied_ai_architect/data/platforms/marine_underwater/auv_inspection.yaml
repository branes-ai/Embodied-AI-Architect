  identity: [AUV, autonomous underwater vehicle, underwater inspection, subsea inspection, underwater robot]
  descriptions: [pipeline inspection AUV, hull inspection robot, subsea survey vehicle, underwater survey robot, deep-sea inspector]
  application: [pipeline inspection, hull inspection, subsea infrastructure, underwater survey, offshore inspection]
  industry: [oil and gas, offshore energy, marine, subsea, naval, port operations]
  components: [thruster, DVL, USBL, side-scan sonar, pressure hull]
  related: [ROV, subsea, bathymetry, cathodic protection, marine growth]

