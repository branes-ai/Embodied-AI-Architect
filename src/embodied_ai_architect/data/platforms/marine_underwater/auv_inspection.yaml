context:
  typical_architecture: "A torpedo or box-shaped vehicle carries sonar (side-scan and/or multibeam), cameras, and a DVL for navigation. USBL acoustic positioning provides geo-referencing. The AUV follows pre-programmed survey lines autonomously, collecting data for onshore post-processing. Some systems support real-time classification of pipeline anomalies. Navigation relies on INS + DVL + USBL fusion due to the absence of GPS underwater."
  common_pitfalls:
    - "Acoustic positioning (USBL) drift accumulates on long survey lines without loop closures"
    - "Turbidity and marine growth degrade camera image quality"
    - "Current and surge can push the vehicle off survey track"
    - "Communication bandwidth through water is extremely limited (acoustic: ~10 kbps)"
  regulatory:
    - "DNV-ST-0511 (autonomous and remotely operated vehicles)"
    - "API 1160 (pipeline integrity management in operating pipelines)"
    - "IMCA guidelines for AUV operations"
  reference_designs:
    - "Saab Sabertooth"
    - "Kongsberg Hugin"
    - "General Dynamics Bluefin"
  design_considerations: "Inspection AUVs must navigate precisely without GPS using INS/DVL/USBL sensor fusion. Camera and sonar data quality degrades with turbidity, marine growth, and distance from target—altitude and standoff control are critical. Battery capacity limits mission endurance; energy-efficient transit and survey speeds must be balanced. Data volumes are massive (terabytes per mission), requiring efficient onboard storage and post-processing pipelines. Pressure hull design must match target depth rating. Consider resident AUV concepts for permanent subsea deployment to reduce vessel costs."

qualification:
  suggested_questions: [max_depth, survey_target, mission_endurance, navigation_accuracy, data_products, launch_recovery_method]
  critical_constraints: [depth_rating, navigation_accuracy_m, endurance_hours, sensor_suite]
  optional_constraints: [resident_capability, manipulation_arm, real_time_classification, docking_station]
