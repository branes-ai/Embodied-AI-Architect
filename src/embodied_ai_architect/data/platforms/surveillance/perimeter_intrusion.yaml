    compute_power_watts: 30
  safety:
    level: "security grade"
    certifications: ["UL 2900 cybersecurity", "NDAA Section 889 compliant", "CPNI approved", "IEC 62676"]

context:
  typical_architecture: "Multi-layer detection architecture: primary detection via fiber-optic fence sensor or radar providing zone-level alerts, verified by auto-slewing PTZ thermal/visible cameras with on-edge video analytics for classification. Edge compute nodes at each camera cluster run detection and tracking, with centralized VMS/PSIM for correlation, display, and response coordination."
  common_pitfalls:
    - "High nuisance alarm rate (animals, weather, vegetation) erodes operator trust and response effectiveness"
    - "Thermal cameras lose contrast at dawn/dusk crossover periods"
    - "Fiber-optic sensors require per-site calibration to distinguish fence climbing from wind or rain vibration"
    - "Camera coverage gaps at corners and undulating terrain require careful site survey"
    - "Cybersecurity of IP cameras is critical; compromised cameras are a direct security breach"
    - "PTZ camera mechanical wear from continuous slewing reduces MTBF to 2-3 years"
  regulatory:
    - "CFATS for chemical facilities"
    - "NERC CIP for energy infrastructure"
    - "TSA security directives for transportation"
    - "ITAR for military installations"
    - "GDPR/privacy for areas near public land"
  reference_designs:
    - "FLIR Elara / Quasar perimeter solution"
    - "Axis Perimeter Defender"
    - "Magos radar + camera integration"
    - "Senstar FiberPatrol / FlexZone"
    - "Optex REDSCAN LiDAR"
  design_considerations: "Perimeter systems must achieve near-zero missed detections while minimizing nuisance alarms; the industry target is probability of detection (Pd) > 0.95 with nuisance alarm rate < 1 per zone per day. Multi-sensor fusion (radar + thermal + video analytics) dramatically reduces false positives compared to single-sensor approaches. Edge compute must survive -40C to +65C without fans, favoring low-power inference accelerators. The system must operate continuously for 5+ years with minimal maintenance, so MTBF of all components is a primary design driver."

