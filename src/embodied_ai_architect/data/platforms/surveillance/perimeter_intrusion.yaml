implications:
  platform_type: "surveillance"
  perception:
    camera_types: ["thermal LWIR", "PTZ visible", "fixed wide-angle", "stereo depth"]
    detection_classes: ["person", "vehicle", "animal", "crawling person", "climbing person", "fence cut", "thrown object", "drone"]
    max_latency_ms: 300
    min_fps: 15
  sensors:
    modalities: ["thermal camera", "visible camera", "radar", "fiber optic vibration", "microwave barrier", "PIR sensor", "seismic sensor", "acoustic sensor"]
  actuators:
    actuator_types: ["PTZ pan/tilt motor", "spotlight", "siren", "gate lock"]
    dof: 2
    control_rate_hz: 10
  comms:
    protocols: ["Ethernet/IP", "ONVIF", "RTSP", "SIA DC-07", "Modbus", "dry contact alarm"]
