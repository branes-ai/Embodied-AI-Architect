context:
  typical_architecture: "Network of overhead fisheye or wide-angle cameras (one per 50-100 sqm) feeding edge compute nodes that run density estimation CNNs. Results aggregate to a central dashboard showing real-time heatmaps, zone occupancy counts, and flow vectors. Alert thresholds trigger notifications to control room operators when density exceeds safe levels (typically 4-6 persons/sqm depending on venue type)."
  common_pitfalls:
    - "Overhead camera mounting height and lens selection critically affect counting accuracy; too high loses individuals in dense crowds"
    - "Privacy regulations (GDPR, CCPA) may prohibit face-resolution imagery; density estimation models work on blob-level features"
    - "Occlusion in dense crowds (>4 persons/sqm) causes standard detection models to undercount by 30-50%"
    - "Lighting changes during concerts/events cause dramatic accuracy degradation without robust preprocessing"
    - "Alert fatigue from poorly calibrated thresholds leads operators to ignore genuine crush warnings"
  regulatory:
    - "GDPR/CCPA data protection and privacy impact assessment"
    - "Local CCTV code of practice"
    - "EN 50132 for video surveillance systems"
    - "Venue licensing conditions for maximum occupancy"
    - "Guide to Safety at Sports Grounds (Green Guide)"
  reference_designs:
    - "Axis People Counter"
    - "Hikvision Crowd Density Detection"
    - "HELLA Aglaia people sensing"
    - "Irisity IRIS crowd analytics"
    - "Viisights behavioral analytics"
  design_considerations: "Crowd analytics systems must prioritize density estimation over individual tracking in high-density scenarios; CSRNet-style density map regression outperforms detection-based counting above 2 persons/sqm. Camera placement is the single most impactful design decision: overhead mounting at 6-10m with fisheye lenses maximizes coverage while minimizing occlusion. Edge processing per camera is preferred over centralized GPU servers to reduce bandwidth (a single 4K stream at 15fps is ~15 Mbps) and latency. The system should output Fruin Level-of-Service grades (A-F) mapped to actionable crowd management protocols."

qualification:
  suggested_questions:
    - venue_type
    - peak_occupancy
    - area_sqm
    - camera_mounting_height
    - privacy_jurisdiction
  critical_constraints:
    - "Real-time density estimation (< 2s latency)"
    - "Counting accuracy > 90% up to 4 persons/sqm"
    - "Privacy-compliant (no face storage)"
    - "24/7 continuous operation"
  optional_constraints:
    - "Flow direction analysis"
    - "Queue wait time estimation"
    - "Integration with PA/signage systems"
