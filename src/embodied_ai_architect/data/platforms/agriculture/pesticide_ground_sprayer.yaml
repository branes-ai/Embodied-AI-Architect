context:
  typical_architecture: "Electric or diesel-electric 4WD platform with 200-1000L spray tank, boom-mounted high-speed cameras (one per nozzle section), and per-nozzle solenoid valves for spot spraying. Edge GPU (Jetson Orin class) runs weed detection CNN at 30fps with < 25ms latency to trigger nozzles at travel speeds up to 12 km/h. RTK GPS provides centimeter-level guidance for autonomous row following."
  common_pitfalls:
    - "Nozzle-to-camera latency must account for vehicle speed; at 12 km/h a 25ms delay means 8cm of travel error"
    - "Weed detection models trained on one growth stage fail on another; continuous model updates are essential"
    - "Soil compaction from heavy sprayer platforms damages crop roots; lightweight design or controlled traffic is critical"
    - "Chemical spray drift from ground application is lower than aerial but still regulated within 5m of waterways"
    - "Dust and moisture on camera lenses require self-cleaning (air blast or wiper) mechanisms"
    - "GPS RTK signal loss under tree canopy in orchards requires dead-reckoning fallback"
  regulatory:
    - "ISO 18497 safety for autonomous agricultural machines"
    - "EPA pesticide application regulations"
    - "State pesticide applicator licensing"
    - "Buffer zone requirements near water and habitation"
    - "Machine Directive 2006/42/EC (EU)"
  reference_designs:
    - "John Deere See & Spray Ultimate"
    - "Blue River Technology (acquired by Deere)"
    - "Ecorobotix ARA"
    - "Bilberry smart spraying"
    - "SwarmFarm Robotics"
  design_considerations: "The core technical challenge is achieving sub-25ms weed detection latency to enable spot spraying at field speeds, which requires per-nozzle camera placement and dedicated inference hardware. Herbicide savings of 70-90% justify the higher platform cost. The detection model must handle green-on-green discrimination (weed vs crop) which is significantly harder than green-on-brown (weed vs bare soil) and typically requires species-level classification CNNs. Boom height control with 5cm accuracy prevents nozzle-to-target distance variation that would degrade spray pattern uniformity."

qualification:
  suggested_questions:
    - crop_type
    - field_size_hectares
    - weed_species
    - spray_type
    - terrain_slope
  critical_constraints:
    - "Weed detection latency < 25ms"
    - "Per-nozzle control capability"
    - "RTK GPS guidance accuracy < 2cm"
    - "Chemical-resistant construction"
  optional_constraints:
    - "Green-on-green detection capability"
    - "Orchard/vineyard row following"
    - "Night operation capability"
