context:
  typical_architecture: "Circular or D-shaped chassis with LiDAR turret (ToF or triangulation) for SLAM-based room mapping. Main compute SoC (ARM Cortex-A class) runs SLAM, path planning, and optional AI-based obstacle avoidance. Cleaning system combines roller brush, side brush, and centrifugal suction fan (2000-6000 Pa). Optional mopping module with vibrating pad and water tank. IR-guided dock return for autonomous charging. Cloud-connected app for maps, schedules, and no-go zones."
  common_pitfalls:
    - "LiDAR SLAM fails in rooms with all-glass furniture or highly reflective surfaces"
    - "Cable and cord entanglement is the most common failure mode; AI obstacle avoidance has improved but is not perfect"
    - "Cliff sensors fail on dark-colored rugs that absorb IR, causing false cliff detection and missed areas"
    - "Mop modules leave excess water on hardwood floors without proper water flow control"
    - "Pet waste incidents ('poopocalypse') require reliable object detection; this is a real customer pain point"
    - "Battery degradation over 2-3 years reduces run time below useful threshold for large homes"
  regulatory:
    - "UL 60335-2-2 for vacuum cleaners"
    - "FCC Part 15 for wireless emissions"
    - "CE marking for EU markets"
    - "Privacy regulations for camera-equipped models (in-home imagery)"
    - "Battery safety (UL 2054 for lithium-ion)"
  reference_designs:
    - "iRobot Roomba j9+"
    - "Roborock S8 MaxV Ultra"
    - "Ecovacs Deebot X2 Omni"
    - "Dyson 360 Vis Nav"
    - "Dreame X40 Ultra"
    - "Samsung Bespoke Jet Bot AI"
  design_considerations: "Robot vacuums are the highest-volume consumer robotics product, making BOM cost the dominant design constraint. The compute budget of 2-4W total must cover SLAM, path planning, and increasingly AI-based obstacle avoidance on a single low-cost SoC. LiDAR-based SLAM has become the standard for mid-range and above, replacing camera-only vSLAM for mapping reliability. AI obstacle avoidance using a forward camera with a lightweight detection model (MobileNet/YOLO-nano class) is the current differentiator. The mechanical cleaning system (brush design, suction power, edge cleaning) remains as important as navigation intelligence for actual cleaning performance."

