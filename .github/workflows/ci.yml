name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install linters
        # Pin to match the project's .venv (see pyproject dev extras) so CI is
        # deterministic and does not drift onto a newer Black/Ruff that reformats
        # files the committed, locally-linted tree considers clean.
        run: pip install black==25.12.0 ruff==0.14.10

      - name: Black check
        run: black --check src/ tests/ --line-length 100

      - name: Ruff check
        run: ruff check src/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short -x --ignore=tests/agents/ \
            ${{ matrix.python-version == '3.11' && '--cov=src/embodied_ai_architect --cov-report=term-missing' || '' }}

  test-optional-deps:
    name: Test (optional deps)
    needs: lint
    runs-on: ubuntu-latest
    # No continue-on-error — failures are real failures

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package with optional deps
        run: pip install -e ".[dev,optimization,api]"

      - name: Run MOO tests
        run: pytest tests/test_moo_*.py tests/test_bayesian_*.py -v --tb=short

      - name: Run API server tests
        run: pytest tests/test_api_server.py -v --tb=short

      - name: Run agent tests (requires onnx)
        run: |
          pip install onnx onnxscript onnxruntime
          pytest tests/agents/ -v --tb=short
