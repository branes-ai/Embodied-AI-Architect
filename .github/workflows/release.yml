name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs-site/**"
      - "docs/**"
      - "*.md"
  workflow_dispatch:
    inputs:
      skip_semantic_release:
        description: "Skip semantic-release version bump (use current version)"
        type: boolean
        default: false

jobs:
  test:
    name: Test (release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short -x --ignore=tests/agents/

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # For OIDC PyPI publishing (future)

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install python-semantic-release build

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Semantic release version
        id: version
        if: ${{ !inputs.skip_semantic_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release version
          echo "released=$(git diff HEAD~1 --name-only | grep -c pyproject.toml || true)" >> $GITHUB_OUTPUT

      - name: Build package
        if: steps.version.outputs.released != '0' || inputs.skip_semantic_release
        run: python -m build

      - name: Semantic release publish
        if: steps.version.outputs.released != '0' && !inputs.skip_semantic_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release publish

      - name: Publish to PyPI
        if: steps.version.outputs.released != '0' || inputs.skip_semantic_release
        uses: pypa/gh-action-pypi-publish@release/v1
