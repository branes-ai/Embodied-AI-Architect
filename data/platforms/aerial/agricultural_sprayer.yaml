implications:
  platform_type: "aerial"
  perception:
    camera_types: ["downward multispectral", "forward stereo", "downward RGB"]
    detection_classes: ["crop row", "obstacle", "person", "tree", "power line", "weed", "diseased area"]
    max_latency_ms: 100
    min_fps: 10
  sensors:
    modalities: ["RGB camera", "multispectral camera", "RTK GPS", "IMU", "radar altimeter", "flow sensor", "wind sensor"]
  actuators:
    actuator_types: ["brushless DC motor", "peristaltic pump", "spray nozzle servo"]
    dof: 4
    control_rate_hz: 200
  comms:
    protocols: ["900MHz radio", "4G/LTE", "MAVLink", "Wi-Fi"]
  power:
    compute_power_watts: 10
  safety:
    level: "agricultural equipment"
    certifications: ["Part 107", "EPA pesticide application", "state ag permits"]

context:
  typical_architecture: "Heavy-lift hexacopter or octocopter frame with 10-40L liquid tank, centrifugal or peristaltic pump system, and 4-8 spray nozzles. Flight controller with RTK GPS for centimeter-level swath accuracy. Companion computer runs prescription map overlay and variable-rate control logic."
  common_pitfalls:
    - "Spray drift in winds above 3 m/s causes off-target contamination and regulatory violations"
    - "Tank slosh during aggressive maneuvers destabilizes flight; baffled tanks are essential"
    - "Nozzle clogging from particulate matter requires in-line filtration and flow monitoring"
    - "Short flight times (8-12 min loaded) demand efficient multi-battery swap logistics"
    - "Corrosive chemicals degrade airframe and electronics without proper sealing"
  regulatory:
    - "FAA Part 107 and Part 137 agricultural aircraft operator certificate"
    - "EPA Worker Protection Standard for pesticide application"
    - "State-level pesticide applicator licensing"
    - "Drift buffer zone regulations near water bodies"
  reference_designs:
    - "DJI Agras T40"
    - "XAG P100"
    - "Hylio AG-272"
    - "HSE UAV AG V6A+"
  design_considerations: "Agricultural sprayer drones operate in a regime where liquid payload mass dominates total weight, so structural efficiency and motor sizing are driven by the full-tank takeoff weight. Perception requirements are modest compared to urban drones; the primary compute task is GPS-guided path following with terrain-following altitude hold. Variable-rate spraying requires real-time lookup against prescription maps at 10Hz+. The compute budget should prioritize reliability and thermal tolerance over raw performance, as field conditions involve dust, vibration, and temperature extremes."

qualification:
  suggested_questions:
    - tank_capacity_liters
    - field_size_hectares
    - spray_type
    - terrain_type
    - chemical_compatibility
  critical_constraints:
    - "Spray rate accuracy within 5%"
    - "Swath overlap < 10%"
    - "Wind speed operating limit"
    - "Chemical-resistant materials"
  optional_constraints:
    - "Multispectral crop health detection"
    - "Spot spraying capability"
    - "Night operation lighting"
