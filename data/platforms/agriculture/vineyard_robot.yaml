context:
  typical_architecture: "Narrow-track electric platform (< 1.2m wide) designed to fit between vineyard rows spaced 1.5-2.5m apart. Side-mounted cameras and LiDAR scan the vine canopy on both sides as the robot drives slowly (2-5 km/h) down each row. Edge compute processes canopy imagery for disease detection (mildew, botrytis), vigor mapping, and yield estimation. Optional tool arm for mechanical operations (leaf pulling, shoot positioning). RTK GPS with row-detection fallback for navigation under dense canopy."
  common_pitfalls:
    - "Steep vineyard slopes (up to 45% grade) require low center of gravity and differential traction control"
    - "Vine trellis wires and hanging shoots snag on robot body; enclosed chassis design is essential"
    - "GPS signal degradation under dense canopy requires visual row-following as primary navigation mode"
    - "Disease detection models must be trained per grape variety as leaf morphology varies significantly"
    - "Wet soil conditions after rain make vineyard rows impassable for weeks; wide tires and low ground pressure help"
  regulatory:
    - "ISO 18497 autonomous agricultural machinery"
    - "EU Machinery Directive"
    - "Organic certification restrictions on spray chemicals"
    - "Local labor regulations for harvesting automation"
  reference_designs:
    - "Naiotech TED vineyard robot"
    - "VitiBot Bakus"
    - "Pellenc Robotic vineyard tractor"
    - "Agreenculture Ceol"
    - "SITIA Trektor"
  design_considerations: "Vineyard robots must navigate extremely constrained row widths (1.5-2.5m) on irregular terrain with slopes up to 30 degrees, making platform stability and traction the primary mechanical challenges. Canopy-level perception is unique: the camera must image individual leaves and grape clusters at close range (0.3-1m) while the robot moves, requiring high-resolution sensors and motion compensation. Disease detection (especially early-stage mildew) demands multispectral or hyperspectral imaging in the 400-1000nm range. Battery-electric drive is strongly preferred to avoid diesel exhaust contamination of grapes."

