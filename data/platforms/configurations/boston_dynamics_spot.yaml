id: ugv.boston_dynamics_spot
name: "Boston Dynamics Spot"
category: ugv
product_type: quadruped
vendor: "Boston Dynamics"
description: "Agile quadruped robot for autonomous inspection and data collection. Features 360-degree perception, dynamic obstacle avoidance, and ability to traverse stairs, slopes, and rough terrain. Payload mounting system supports custom sensors and compute payloads."
aliases:
  - "Spot"
  - "Spot Robot"
  - "SpotWalk"

keywords:
  identity:
    - boston dynamics
    - spot
    - quadruped
    - legged robot
    - walking robot
  application:
    - industrial inspection
    - remote monitoring
    - hazardous environment
    - construction
    - oil and gas
    - mining

specifications:
  weight_kg: 32.0
  max_payload_kg: 14.0
  power_watts: 400
  battery_wh: 605
  max_speed_mps: 1.6
  ip_rating: "IP54"
  operating_temp_c: {min: -20, max: 45}

compute:
  processor: "Intel Core i5 + 2x NVIDIA GPUs"
  compute_tops: 5

sensors:
  - type: "stereo_camera"
    name: "Stereo Cameras (x5 pairs)"
    resolution: "640x480"
  - type: "depth_camera"
    name: "Depth Cameras (x5)"
  - type: "imu"
    name: "IMU"

pricing:
  base_price_usd: 75000
  year: 2024
