  max_payload_kg: 16.0
  power_watts: 600
  battery_wh: 2000
  max_speed_mps: 1.5
  ip_rating: "IP54"
  operating_temp_c: {min: 0, max: 40}

compute:
  processor: "Intel + NVIDIA GPU"
  compute_tops: 20

sensors:
  - type: "lidar"
    name: "LiDAR"
    range_m: 30
  - type: "depth_camera"
    name: "Intel RealSense Depth Cameras"
  - type: "rgb_camera"
    name: "Head Cameras"
  - type: "imu"
    name: "IMU"
  - type: "force_torque"
    name: "Wrist Force/Torque Sensors"

pricing:
  base_price_usd: 250000
