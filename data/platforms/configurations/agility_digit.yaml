aliases:
  - "Digit"
  - "Agility Digit"

keywords:
  identity:
    - agility
    - digit
    - humanoid
    - bipedal
    - logistics robot
  application:
    - warehouse logistics
    - package handling
    - tote manipulation
    - human-designed spaces
    - last-mile delivery

specifications:
