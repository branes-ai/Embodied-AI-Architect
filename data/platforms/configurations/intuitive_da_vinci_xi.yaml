  weight_kg: 871.0
  power_watts: 2500
  dof: 7
  operating_temp_c: {min: 15, max: 30}

compute:
  processor: "Intuitive proprietary real-time controller"
  compute_tops: 0

sensors:
  - type: "stereo_endoscope"
    name: "3D HD Endoscope"
    resolution: "1920x1080"
  - type: "force_estimation"
    name: "Instrument Force Estimation"
  - type: "position_encoder"
    name: "Joint Encoders (per arm)"
