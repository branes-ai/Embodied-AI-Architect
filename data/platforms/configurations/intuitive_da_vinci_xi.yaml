description: "Fourth-generation surgical robot system with four overhead-mounted arms on a rotating boom. Features 3D HD endoscopic vision, EndoWrist instruments with 7 DOF, and integrated fluorescence imaging. Used in urology, gynecology, thoracic, and general surgery."
