implications:
  platform_type: "ground_wheeled"
  perception:
    camera_types: ["forward stereo", "360 LiDAR", "floor-facing"]
    detection_classes: ["person", "forklift", "pallet", "shelf", "obstacle", "doorway", "charging station"]
    max_latency_ms: 80
    min_fps: 15
  sensors:
    modalities: ["2D LiDAR", "3D LiDAR", "RGB camera", "depth camera", "wheel odometry", "IMU", "safety bumper", "cliff sensor"]
  actuators:
    actuator_types: ["brushless DC wheel motor", "lifting actuator"]
    dof: 2
    control_rate_hz: 50
  comms:
    protocols: ["Wi-Fi 6", "5G private network", "REST API", "ROS 2 DDS"]
  power:
    compute_power_watts: 15
  safety:
    level: "ISO 3691-4"
    certifications: ["ISO 3691-4", "ANSI/ITSDF B56.5", "CE", "UL"]

context:
  typical_architecture: "Differential-drive base with 2D/3D LiDAR for SLAM and obstacle avoidance, plus safety-rated laser scanners for protective field monitoring. Central compute module (x86 or Jetson class) runs localization, path planning, and fleet coordination. Lifting platform or towing hitch for payload engagement. Battery with opportunity charging at designated stations."
  common_pitfalls:
    - "SLAM drift in featureless warehouse aisles requires supplemental localization (reflectors, QR codes, or UWB)"
    - "Dynamic obstacle avoidance must handle humans walking unpredictably at close range"
    - "Fleet deadlocks at intersections without centralized traffic management"
    - "Charging station contention during peak hours reduces effective fleet throughput"
    - "Floor surface variation (joints, ramps, debris) causes wheel slip and odometry errors"
  regulatory:
    - "ISO 3691-4 for driverless industrial trucks"
    - "ANSI/ITSDF B56.5 for guided industrial vehicles"
    - "OSHA guidelines for human-robot shared workspaces"
    - "Local fire code for battery charging areas"
  reference_designs:
    - "Locus Robotics Origin"
    - "6 River Systems Chuck"
    - "Fetch Robotics Freight"
    - "Amazon Proteus"
    - "MiR250"
  design_considerations: "Warehouse AMRs operate in highly dynamic shared spaces where safety-rated sensing (dual-channel LiDAR with SIL-2 rated processing) is non-negotiable. The perception stack must handle both static map-based navigation and real-time dynamic obstacle avoidance simultaneously. Fleet-level coordination is as important as individual robot intelligence; a central fleet manager must prevent deadlocks and optimize throughput. Battery sizing should target a full shift (8h) with opportunity charging to avoid fleet downtime clustering."

qualification:
  suggested_questions:
    - payload_capacity_kg
    - facility_size_sqm
    - fleet_size
    - wms_integration
    - aisle_width_m
  critical_constraints:
    - "Payload capacity 50-500 kg"
    - "Safety-rated obstacle detection"
    - "WMS/WCS integration"
    - "8+ hour continuous operation"
  optional_constraints:
    - "Multi-floor operation (elevator integration)"
    - "Cold storage tolerance (-25C)"
    - "IP54 dust/water protection"
