implications:
  platform_type: "manipulation"
  perception:
    camera_types: ["overhead deck camera", "tip-mounted camera", "barcode reader"]
    detection_classes: ["microplate", "tube", "tip rack", "reservoir", "liquid level", "bubble", "barcode"]
    max_latency_ms: 50
    min_fps: 15
  sensors:
    modalities: ["capacitive liquid detection", "pressure sensor", "barcode scanner", "deck camera", "tip presence sensor", "temperature sensor"]
  actuators:
    actuator_types: ["stepper motor (XYZ gantry)", "pipette piston motor", "plate gripper", "tip ejector"]
    dof: 4
    control_rate_hz: 100
  comms:
    protocols: ["USB", "Ethernet", "RS-232", "LIMS integration (HL7/ASTM)", "REST API"]
  power:
    compute_power_watts: 15
  safety:
    level: "IVD / laboratory"
    certifications: ["CE IVD", "UL 61010", "ISO 13485", "21 CFR Part 11"]

context:
  typical_architecture: "XYZ gantry system with single or multi-channel pipetting head (1, 8, 96, or 384 channels) mounted on a linear rail system. Deck layout holds microplates, tip racks, reservoirs, and peripheral modules (shaker, heater/cooler, magnetic separator). Embedded controller manages motion and aspiration/dispense profiles. Host PC runs protocol design software with LIMS integration. Liquid detection via capacitive or pressure sensing ensures accurate aspirations."
  common_pitfalls:
    - "Pipetting accuracy degrades with viscous liquids (glycerol, DMSO) unless liquid class parameters are tuned per reagent"
    - "Tip-to-tip variation in multi-channel heads compounds across serial dilution steps; regular calibration is critical"
    - "Bubble formation during aspiration causes volume errors; slow aspiration speed and submerged tip entry mitigate this"
    - "Cross-contamination from tip reuse or aerosol carry-over invalidates sensitive assays (PCR)"
    - "Deck position teaching drifts over time due to thermal expansion of the gantry frame"
    - "21 CFR Part 11 compliance for clinical/GxP labs requires audit trails on all protocol modifications"
  regulatory:
    - "CE IVD for clinical diagnostic applications"
    - "21 CFR Part 11 electronic records and signatures"
    - "ISO 13485 quality management for medical devices"
    - "ISO 8655 gravimetric pipette calibration"
    - "CLIA/CAP for clinical laboratory use"
  reference_designs:
    - "Hamilton STAR / STARlet"
    - "Beckman Coulter Biomek i7"
    - "Tecan Fluent / Freedom EVO"
    - "OpenTrons OT-2 / Flex"
    - "Agilent Bravo"
    - "PerkinElmer Janus"
  design_considerations: "Liquid handler accuracy is specified as coefficient of variation (CV%) at target volumes; achieving < 2% CV at 1uL requires precise piston control, consistent tip seating, and per-liquid-class tuning of aspiration/dispense speeds. The gantry must achieve 0.1mm positional repeatability to reliably enter 384-well plates (well pitch = 4.5mm). Protocol throughput is dominated by tip handling time; systems with washable tips or 96-channel heads dramatically reduce per-plate processing time. For regulated environments, every pipetting event must be logged with timestamp, volume, position, and operator identity."

qualification:
  suggested_questions:
    - volume_range_ul
    - throughput_plates_per_day
    - assay_type
    - regulatory_environment
    - channel_count
  critical_constraints:
    - "Volume accuracy CV < 5% at target volume"
    - "Positional repeatability < 0.1mm"
    - "LIMS/LIS integration"
    - "Contamination prevention"
  optional_constraints:
    - "BSL-2/3 enclosure"
    - "21 CFR Part 11 compliance"
    - "384-well plate support"
    - "Heated/cooled deck positions"
