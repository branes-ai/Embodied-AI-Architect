context:
  typical_architecture: "Cart-mounted robotic arm with 6-DOF kinematics and force/torque sensing at the end effector. Pre-operative CT scan is segmented to create a patient-specific 3D bone model for surgical planning. Intra-operative registration aligns the plan to the patient using surface digitization or fluoroscopy. During cutting, the robot either actively guides the saw/burr along planned resection planes or provides haptic boundaries that constrain the surgeon's hand."
  common_pitfalls:
    - "Bone registration accuracy degrades if tracker line-of-sight is occluded by surgical team; OR layout must be carefully planned"
    - "Bone-mounted reference arrays can loosen during surgery, causing catastrophic navigation error"
    - "Soft tissue retraction changes bone position relative to pre-op CT; dynamic tracking is essential"
    - "Sterilization cycles (autoclave at 134C) degrade optical components and cable insulation over time"
    - "Surgeon learning curve of 20-40 cases before achieving consistent time savings over manual technique"
  regulatory:
    - "FDA 510(k) or De Novo classification for surgical robots"
    - "EU MDR Class IIb medical device"
    - "IEC 60601-1 medical electrical equipment safety"
    - "IEC 62304 medical device software lifecycle"
    - "ISO 14971 risk management for medical devices"
  reference_designs:
    - "Stryker Mako SmartRobotics"
    - "Smith+Nephew CORI Surgical System"
    - "Zimmer Biomet ROSA Knee/Hip"
    - "Johnson & Johnson VELYS"
    - "Think Surgical TSolution One"
  design_considerations: "Orthopedic surgical robots demand sub-millimeter accuracy (< 1mm position, < 1 degree angular) maintained under cutting forces up to 50N. The control loop must run at 2kHz+ to provide stable haptic feedback and enforce virtual cutting boundaries in real-time. All software is classified IEC 62304 Class C (life-critical), requiring full traceability, formal verification of safety functions, and validated software development lifecycle. The system must integrate with hospital PACS/DICOM for pre-operative planning and post-operative documentation. Sterile draping of the robotic arm adds 10-15 minutes to setup and must not compromise joint movement or force sensing."

