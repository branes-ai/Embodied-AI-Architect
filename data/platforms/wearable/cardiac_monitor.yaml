context:
  typical_architecture: "Adhesive chest patch or wrist-worn device with dry or wet ECG electrodes feeding a low-noise analog front end (ADS1292 class). Ultra-low-power MCU (Cortex-M4/M33 class) runs real-time QRS detection and rhythm classification at 250-500 Hz sample rate. On-device ML model (< 100KB) performs AF detection and event flagging. Raw ECG data stored to onboard flash for clinician review. BLE connection to smartphone app for real-time display and cloud upload."
  common_pitfalls:
    - "Motion artifacts from daily activities mimic arrhythmia patterns; robust artifact rejection is the primary signal processing challenge"
    - "Electrode-skin impedance increases over multi-day wear as adhesive degrades and skin oils accumulate"
    - "Single-lead ECG cannot differentiate all arrhythmia subtypes; some events require 12-lead confirmation"
    - "Battery life vs sampling rate trade-off: 500Hz provides better morphology but doubles power consumption vs 250Hz"
    - "BLE transmission gaps during phone-out-of-range periods require reliable on-device storage and sync"
    - "False AF alerts erode physician trust; specificity > 95% is more important than sensitivity for screening"
  regulatory:
    - "FDA 510(k) for ECG monitoring devices"
    - "FDA De Novo for AI/ML-based arrhythmia detection software"
    - "IEC 60601-2-47 ambulatory ECG systems"
    - "AAMI EC11 diagnostic ECG requirements"
    - "HIPAA for patient health data"
    - "EU MDR Class IIa for continuous monitoring"
  reference_designs:
    - "Apple Watch ECG (Series 4+)"
    - "AliveCor KardiaMobile 6L"
    - "iRhythm Zio XT / Zio AT"
    - "BioTelemetry MCOT"
    - "Withings ScanWatch"
  design_considerations: "Cardiac monitors are dominated by power constraints; the entire system must operate on a coin cell or small LiPo for 7-14 days, limiting compute to sub-milliwatt MCU inference. The AF detection algorithm must run on-device in real-time with < 100KB model size, typically using handcrafted features (R-R interval variability, P-wave absence) fed to a lightweight classifier rather than deep learning. Signal quality assessment must gate algorithm output to avoid false positives from noisy segments. The analog front end design (input impedance, CMRR, bandwidth) determines the floor of achievable signal quality and is the most critical hardware design decision."

