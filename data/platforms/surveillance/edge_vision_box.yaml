context:
  typical_architecture: "Compact fanless enclosure housing a system-on-module (Jetson Orin, Intel NUC, Hailo-8, or Qualcomm QCS) with hardware video decoder, inference accelerator (GPU/NPU/VPU), and multi-port Ethernet or PoE for camera connectivity. Runs a lightweight Linux OS with container-based model serving (Triton, ONNX Runtime, or TensorRT). Typically processes 4-16 camera streams simultaneously depending on resolution and model complexity."
  common_pitfalls:
    - "Thermal throttling in sealed enclosures limits sustained inference throughput; test at worst-case ambient temperature"
    - "Video decode bandwidth is often the bottleneck before inference; H.265 hardware decode support is essential for multi-stream"
    - "INT8 quantization can degrade accuracy 2-5% if calibration dataset is not representative of deployment conditions"
    - "Model updates over-the-air require robust rollback mechanisms to avoid bricking remote devices"
    - "PoE power budget (15-25W per camera) limits total system power when edge box also runs on PoE"
    - "Memory bandwidth, not TOPS, is usually the true performance limiter for detection models"
  regulatory:
    - "FCC Part 15 for electromagnetic emissions"
    - "CE marking for EU deployment"
    - "NDAA Section 889 if used in government installations"
    - "GDPR/CCPA for video analytics with PII"
  reference_designs:
    - "NVIDIA Jetson Orin NX/Nano DevKit"
    - "Intel NUC with OpenVINO"
    - "Hailo-8 AI Accelerator Module"
    - "Qualcomm QCS8550 Vision Intelligence Platform"
    - "Google Coral Dev Board"
    - "Advantech EI-52 Edge AI System"
    - "AAEON BOXER-8640AI"
  design_considerations: "Edge vision boxes are defined by their performance-per-watt envelope; the key metric is inferences-per-second-per-watt across the target model zoo. Memory bandwidth (not peak TOPS) is typically the binding constraint for detection models like YOLO, so platform selection should prioritize memory subsystem performance. Multi-stream processing requires careful scheduling of decode, preprocess, inference, and postprocess stages to maximize accelerator utilization. Deployment at scale demands container-based model management with OTA update capability, health monitoring, and remote diagnostics."

qualification:
  suggested_questions:
    - number_of_cameras
    - model_type
    - target_fps
    - power_budget_watts
    - deployment_environment
  critical_constraints:
    - "Inference latency < 30ms per frame"
    - "Multi-stream processing (4+ cameras)"
    - "Fanless/sealed operation"
    - "24/7 unattended operation"
  optional_constraints:
    - "IP65 outdoor rating"
    - "PoE powered"
    - "GPU vs NPU preference"
    - "Specific framework support (TensorRT, OpenVINO, ONNX)"
